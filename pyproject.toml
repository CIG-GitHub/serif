[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "serif"
version = "0.3.0"
description = "A Pythonic, zero-dependency vector and table library for interactive data exploration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Ryan Larsen", email = "ryan.e.larsen@gmail.com" }
]

keywords = [
    "vector",
    "table",
    "data",
    "analysis",
    "dataframe",
    "csv"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/CIG-GitHub/serif"
Repository = "https://github.com/CIG-GitHub/serif"
"Bug Tracker" = "https://github.com/CIG-GitHub/serif/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
numpy = ["numpy>=1.24"]
pyarrow = ["pyarrow>=25"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The optional Rust extension (serif._rust) is configured in setup.py, which
# reads SERIF_RUST=optional|required|off to decide whether to build it.

# Compiled wheels (wheels.yml). The pure-Python wheel and sdist are built
# separately with SERIF_RUST=off, so platforms without a compiled wheel
# still install serif without needing a Rust toolchain.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-win_arm64 *_i686"
environment = { SERIF_RUST = "required" }
test-requires = ["pytest"]
# Prove the extension loaded, then run the full suite against the wheel.
test-command = [
    "python -c \"import serif._rust\"",
    "pytest {project}/tests -q",
]

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { SERIF_RUST = "required", PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# Runners are arm64; also cross-compile Intel wheels (tested under Rosetta).
archs = ["arm64", "x86_64"]
before-all = "rustup target add aarch64-apple-darwin x86_64-apple-darwin"

# Rust's x86_64 macOS target needs 10.12+, but older CPython installers ask
# for 10.9, and delocate rejects a binary newer than the declared target.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { SERIF_RUST = "required", MACOSX_DEPLOYMENT_TARGET = "10.13" }
